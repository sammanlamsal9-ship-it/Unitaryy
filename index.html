<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Gallery</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Password Overlay */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #334155;
            width: 90%;
            max-width: 400px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.98); }

        /* Gallery Layout */
        #gallery-content {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .photo-item {
            background: var(--card-bg);
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.3s ease;
        }

        .photo-item:hover {
            transform: translateY(-5px);
        }

        .photo-item img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lock-screen">
        <div class="login-card">
            <h2 style="margin-top:0">🔒 Restricted Access</h2>
            <p style="color: #94a3b8">Enter the password to view the gallery</p>
            <input type="password" id="pw" placeholder="Password...">
            <p id="err" class="error-text">Incorrect Password</p>
            <button onclick="unlock()">Unlock Gallery</button>
        </div>
    </div>

    <!-- Main Gallery -->
    <div id="gallery-content">
        <header>
            <h1>Photo Collection</h1>
            <p style="color: #94a3b8">A curated set of memories.</p>
        </header>

        <div class="grid" id="photo-grid">
            <!-- Images will be injected here -->
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const PASSWORD = "pra(sam)26";

        // ADD YOUR GITHUB IMAGE LINKS HERE
        const PHOTO_LINKS = [
            "IMG_20260515_135448.jpg",
            "IMG_20260515_093433.jpg",
            "IMG_20260515_135258.jpg",
            "IMG_20260515_135305.jpg",
            
        ];
        // ---------------------

        function unlock() {
            const input = document.getElementById('pw').value;
            const error = document.getElementById('err');
            
            if (input === PASSWORD) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('gallery-content').style.display = 'block';
                renderGallery();
            } else {
                error.style.display = 'block';
            }
        }

        function renderGallery() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = ""; // Clear grid

            PHOTO_LINKS.forEach(link => {
                const item = document.createElement('div');
                item.className = 'photo-item';
                item.innerHTML = `<img src="${link}" loading="lazy" onclick="window.open('${link}', '_blank')">`;
                grid.appendChild(item);
            });
        }

        // Listen for Enter key
        document.getElementById('pw').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') unlock();
        });
    </script>
</body>
</html>
